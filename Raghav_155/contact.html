<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Raghav</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="container">
            <h1 class="logo">Raghav's Tech Blog</h1>

            <nav class="navbar">
                <ul class="nav-list">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- CONTACT SECTION -->
    <section class="contact-section">
        <div class="container">

            <h2 class="section-title">Get in Touch</h2>
            <p class="contact-subtext">
                Feel free to reach out for collaboration, queries, or feedback.
            </p>

            <form class="contact-form">

                <!-- NAME -->
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                </div>

                <!-- EMAIL -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <!-- MESSAGE -->
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="5" placeholder="I tried hard to not make it resizable but what the hell"></textarea>
                </div>

                <!-- BUTTON -->
                <button type="submit" class="btn-submit">Send Message</button>

            </form>

        </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <p>© 2026 Raghav/155 | All Rights Reserved</p>
        </div>
    </footer>

</body>
</html>
